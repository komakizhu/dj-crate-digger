interface:
  display_name: "老炮DJ (dj-crate-digger)"
  short_description: "老炮DJ：为 DJ 挖掘、验证、排序并编排适合场景的真实可播放歌单"
  default_prompt: "Use $dj-crate-digger to discover, verify, rank, and sequence music for a DJ set or playlist. Before producing any visible text, read references/language-routing.json and resolve and lock the communication language. For slash-only invocation, read recent user-language signals first, then identity language memory, then host locale; if no signal is sufficient, use the fixed bilingual language confirmation. Only after language_locked, apply references/intake-routing.md: every activated request defaults to the composite report unless the user explicitly selects another mode; a sufficiently specified one-message request or explicit authorization to decide the remaining details skips both questionnaires, while other requests use the fixed two-round intake and keep composite when the mode field is blank. When a round is rendered, reproduce the selected locale resource literally, preserving fields, punctuation, examples, blank lines, inline code, and the single fenced Markdown block. Never infer target market from the UI language."
