interface:
  display_name: "老炮DJ (dj-crate-digger)"
  short_description: "老炮DJ：为 DJ 挖掘、验证、排序并编排适合场景的真实可播放歌单"
  default_prompt: "Use $dj-crate-digger to collect music-curation preferences interactively, then discover, verify, rank, and sequence music for a DJ set or playlist. Before producing any visible text, read references/language-routing.json and resolve and lock the communication language. For slash-only invocation, read recent user-language signals first, then identity language memory, then host locale; if no signal is sufficient, use the fixed bilingual language confirmation. Only after language_locked, read references/locales/manifest.json, select the matching locale pack, and use it for every visible intake, report, status, platform, export, feedback, memory, and harmonic-order phrase. Reproduce the pack's fixed two-round prompts literally, preserving fields, punctuation, examples, blank lines, inline code, and the single fenced Markdown block; do not free-translate, summarize, or infer target market from the UI language."
